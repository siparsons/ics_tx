# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: calendar-bridge
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    numInstances: 1
    disk:
      name: calendar-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CALENDAR_API_KEY
        generateValue: true
      - key: CALENDAR_FEED_TOKEN
        generateValue: true
      - key: CALENDAR_RSA_PRIVATE_KEY
        sync: false
      - key: CALENDAR_RSA_KEY_ID
        value: primary
      - key: CALENDAR_NAME
        value: Work Calendar
      - key: CALENDAR_DB_PATH
        value: /var/data/calendar.db
      - key: CALENDAR_ALLOWED_ORIGINS
        value: https://outlook.office.com,https://outlook.office365.com
      - key: CALENDAR_MAX_PAYLOAD_BYTES
        value: "262144"
      - key: CALENDAR_RETENTION_DAYS
        value: "90"
      - key: CALENDAR_PRIVACY_MODE
        value: full
