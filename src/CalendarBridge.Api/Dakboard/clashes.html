<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Calendar clashes</title>
  <link rel="stylesheet" href="/dakboard-assets/clashes.css?v=3">
  <script type="module" src="/dakboard-assets/clashes.js?v=3"></script>
</head>
<body>
  <main id="widget">
    <p id="unavailable" role="status" hidden>&#9888; Calendar clash data unavailable</p>
    <section id="clash-panel" aria-labelledby="clash-heading" hidden>
      <header class="today-heading"><h1 id="clash-heading"></h1><span id="cached-notice" hidden>Last received clashes</span></header>
      <div id="today-grid" role="list" aria-live="polite" aria-relevant="additions removals text"></div>
    </section>
    <section id="future-panel" aria-label="Future calendar clashes" hidden>
      <h2 id="future-heading"></h2>
      <div id="ticker-window" tabindex="0" aria-label="Future clashes; focus to pause scrolling">
        <div id="ticker-track"></div>
      </div>
    </section>
  </main>
</body>
</html>
